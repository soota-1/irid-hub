name: ci-api

# Skeleton — belum aktif penuh (lihat Task.md Phase 0 & Phase 1.12).
# Step deploy Railway + `golang-migrate up` ditambahkan nanti setelah
# secrets (RAILWAY_TOKEN, DATABASE_URL staging/prod) diprovisioning.

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  vet-lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irid_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/irid_hub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: apps/api

      - name: Test
        run: go test ./... -race -cover

      - name: Build
        run: go build ./...

