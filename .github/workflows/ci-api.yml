name: ci-api

# Deploy step stays commented until the Railway project is linked to this
# repo (needs RAILWAY_TOKEN + staging/production DATABASE_URL secrets) —
# see Task.md Phase 1.12.

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  vet-lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: apps/api
          version: v2.12.2

      - name: Unit test
        run: go test ./... -race -cover

      - name: Build
        run: go build ./... && go build -tags=integration ./...

      - name: Generate OpenAPI spec and check it's up to date
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/server/main.go --parseInternal -o docs
          go run ./cmd/openapi-gen
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date — run 'swag init' and 'go run ./cmd/openapi-gen' locally and commit the result.";
            exit 1;
          }

      # GitHub-hosted ubuntu runners ship Docker preinstalled/running, so
      # Testcontainers-go (used by these tests) works with no extra setup.
      - name: Integration test (Testcontainers, real Postgres) + OpenAPI contract test
        run: go test -tags=integration ./... -race

  # deploy:
