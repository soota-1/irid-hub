name: ci-web

# Deploy production/preview is handled automatically by the Vercel <->
# Git integration once the Vercel project is linked to this repo (not yet
# done — see Task.md Phase 0/2.6), so this workflow only guards code
# quality (lint, type-check, unit test, e2e test, build).
#
# Uses npm (package-lock.json) — the Phase 0 skeleton assumed pnpm, but
# the app was actually built with npm, so this was updated to match.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"

defaults:
  run:
    working-directory: apps/web

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Unit test
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # Public, non-secret build-time values — a real deployment
          # (Vercel) would inject its own; these just let the build/E2E
          # step run in CI without needing repo secrets.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          VITE_API_BASE_URL: "http://localhost:8080/api/v1"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npx playwright test
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          VITE_API_BASE_URL: "http://localhost:8080/api/v1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
