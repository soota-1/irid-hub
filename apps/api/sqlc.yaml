version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/sqlc/queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlc/gen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
